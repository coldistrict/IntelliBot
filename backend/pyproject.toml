[project]
name = "polymarket-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for Polymarket Copilot v1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15.2,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "fastapi>=0.115.12,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "playwright>=1.51.0,<2.0.0",
    "psycopg[binary]>=3.2.7,<4.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.34.1,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "pytest>=8.3.5,<9.0.0",
    "ruff>=0.11.5,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
    "app/api",
    "app/clients",
    "app/config",
    "app/schemas",
    "app/services/analysis_artifacts.py",
    "app/services/analysis_dispatch.py",
    "app/services/analysis_scoring.py",
    "app/services/analysis_stage_rule_parse.py",
    "app/services/analysis_stage_retrieval_grounding.py",
    "app/services/analysis_stage_fact_pipeline.py",
    "app/services/analysis_stage_scoring.py",
    "app/services/analysis_stage_briefing.py",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
