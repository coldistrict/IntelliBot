name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polymarket_copilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polymarket_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check app tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      # Tests run on SQLite fixtures; this step is the only place migration DDL
      # is exercised against real Postgres before it reaches the dev database.
      - name: Apply migrations to Postgres
        run: uv run alembic -c alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The api-contract vitest exports the backend OpenAPI schema via uv.
      - uses: astral-sh/setup-uv@v5
      - name: Sync backend dependencies
        run: uv sync
        working-directory: backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # frontend scripts load the gitignored root .env via dotenv-cli.
      - name: Create empty .env
        run: touch .env
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Test
        run: pnpm --filter frontend test
      - name: Build
        run: pnpm --filter frontend build
